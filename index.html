<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chistaco</title>
<meta name="description" content="Los chistes de Roc, en audio.">
<meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121116" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chistaco">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="Chistaco">
<meta property="og:description" content="Los chistes de Roc, en audio. Instálala en tu móvil.">
<meta property="og:image" content="https://rocestrem-beep.github.io/chistaco/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobile app shell; header, one scrolling view, mini player and bottom tab bar */
:root{
  --bg:#F7F7F5;
  --surface:#FFFFFF;
  --ink:#16151A;
  --muted:#6E6B76;
  --line:#E6E4EA;
  --accent:#F5A524;
  --accent-ink:#16151A;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121116;--surface:#1C1B22;--ink:#F3F1F7;--muted:#A19DAD;--line:#2C2A34;--accent:#F7B23B;--accent-ink:#16151A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121116;--surface:#1C1B22;--ink:#F3F1F7;--muted:#A19DAD;--line:#2C2A34;--accent:#F7B23B;--accent-ink:#16151A;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:16px calc(150px + env(safe-area-inset-bottom,0px))}

header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:6px 14px}
.logo{font-family:var(--display);font-weight:400;font-size:1.9rem;margin:0;line-height:1}
.logo span{color:var(--accent)}
.sub{color:var(--muted);font-size:.85rem;font-weight:500}

h2.sec{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:26px 0 10px}
h1.view{font-size:1.6rem;font-weight:700;margin:4px 0 4px;text-wrap:balance}

/* Featured card */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
.hero .eyebrow{grid-column:1/-1;font-size:.75rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.09em}
.hero .t{font-size:1.35rem;font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
.hero .m{color:var(--muted);font-size:.88rem;grid-column:1}
.hero .bigplay{grid-row:2/4;grid-column:2}
.bigplay{width:64px;height:64px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer}
.bigplay svg{width:26px;height:26px;fill:currentColor}

/* Joke rows */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list li{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.list li:first-child{border-top:none}
.play{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.play svg{width:16px;height:16px;fill:currentColor}
.play.on,.bigplay.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.info{min-width:0}
.info .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .m{color:var(--muted);font-size:.82rem}
.save{border:none;background:none;color:var(--muted);width:40px;height:40px;display:grid;place-items:center;cursor:pointer;border-radius:10px}
.save svg{width:22px;height:22px}
.save[aria-pressed="true"]{color:var(--accent)}
.share{color:var(--muted);width:40px;height:40px;display:grid;place-items:center;border-radius:10px;text-decoration:none}
.share svg{width:22px;height:22px}
.hero .actions{grid-column:1/-1;margin-top:10px;display:flex;gap:8px}
.hero .hsave{font:inherit;font-weight:600;font-size:.92rem;color:var(--ink);background:none;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.hero .hsave svg{width:18px;height:18px}
.hero .hsave[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.hero .hsave[aria-pressed="true"] svg path{fill:currentColor}
.hero .wa{flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.92rem;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.hero .wa svg{width:18px;height:18px}
.save[aria-pressed="true"] svg path{fill:currentColor}

/* Categories */
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:92px}
.cat .e{font-size:1.5rem;line-height:1}
.cat .n{font-weight:700}
.cat .c{color:var(--muted);font-size:.82rem}
.back{font:inherit;font-weight:600;color:var(--muted);background:none;border:none;padding:4px 0;cursor:pointer}

/* Search */
.search{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:16px}

/* Mini player + tab bar */
.dock{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line)}
.dock-in{max-width:560px;margin:0 auto}
.mini[hidden]{display:none}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.mini .t{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:3px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.time{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{font:inherit;font-size:.72rem;font-weight:600;color:var(--muted);background:none;border:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{stroke:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body{margin:0;-webkit-tap-highlight-color:transparent}
.app{padding-top:calc(16px + env(safe-area-inset-top,0px))}
/* Install card (only in the browser, not once installed) */
.install{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.install img{width:44px;height:44px;border-radius:11px}
.install .t{font-weight:700;font-size:.95rem}
.install .m{color:var(--muted);font-size:.82rem;line-height:1.35}
.install .x{border:none;background:none;color:var(--muted);font-size:1.3rem;width:34px;height:34px;cursor:pointer;border-radius:8px}
.install .go{grid-column:1/-1;font:inherit;font-weight:700;font-size:.92rem;border:none;border-radius:12px;padding:11px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <p class="logo">Chista<span>co</span></p>
    <span class="sub" id="total"></span>
  </header>
  <div id="install"></div>
  <main id="view"></main>
</div>

<div class="dock">
  <div class="dock-in">
    <div class="mini" id="mini" hidden>
      <button class="play" id="miniPlay" type="button" aria-label="Pausar"></button>
      <div style="min-width:0">
        <div class="t" id="miniTitle"></div>
        <div class="bar"><i id="miniBar"></i></div>
      </div>
      <span class="time" id="miniTime">0:00</span>
    </div>
    <nav class="tabs" aria-label="Menú">
      <button class="tab" type="button" data-tab="home"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>Destacados</button>
      <button class="tab" type="button" data-tab="cats"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Categorías</button>
      <button class="tab" type="button" data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Buscar</button>
      <button class="tab" type="button" data-tab="saved"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></svg>Guardados</button>
    </nav>
  </div>
</div>

<script>
/* Jokes. audio: path of the recording published with the app (null = not recorded yet, the phone reads the text). */
const J = [
  {id:"adoptado", t:"El adoptado", cat:"Humor negro", top:true, audio:"audios/adoptado.mp3",
   text:"—Papá, ¿yo soy adoptado?\n—Hijo, te escogimos negro para no hablar del tema."},
  {id:"notaria", t:"La notaría", cat:"Juegos de palabras", top:true, audio:"audios/notaria.mp3",
   text:"—Perdona, ¿la notaría?\n—Si te arrimas un poco, tal vez sí."},
  {id:"nostalgicos", t:"Asociación de nostálgicos", cat:"Asociaciones", top:false, audio:"audios/nostalgicos.mp3",
   text:"Asociación de nostálgicos"}
];
const CATS = [
  {n:"Asociaciones", e:"🏛️"},
  {n:"Humor negro", e:"🖤"},
  {n:"Familia", e:"👨‍👩‍👦"},
  {n:"Juegos de palabras", e:"🔤"},
  {n:"Cortos", e:"⚡"}
];

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const ICON_SAVE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';

const ICON_SHARE = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5"/><path d="M7.5 8L12 3.5 16.5 8"/><path d="M5 12.5v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>';
const APP_URL = "https://rocestrem-beep.github.io/chistaco/";
const wa = j => "https://wa.me/?text=" + encodeURIComponent(j.text + "\n\n😂 Escúchalo y más chistes en Chistaco: " + APP_URL);

let saved = new Set(store.get("chistaco.saved",[]));
let tab = "home", openCat = null, query = "";
let curId = null, playing = false, token = 0;
const audio = new Audio();
const synth = window.speechSynthesis || null;
let voice = null;
function pickVoice(){ if(!synth) return; const vs=synth.getVoices(); voice = vs.find(v=>v.lang==="es-ES")||vs.find(v=>/^es/i.test(v.lang))||null; }
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }

const byId = id => J.find(j=>j.id===id);
const fmt = s => { s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
function dayPick(){ const d=new Date(); const n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5); return J[n % J.length]; }

/* ---------- playback ---------- */
function stopAll(){ token++; audio.pause(); if(synth) synth.cancel(); }
function setState(on){ playing = on; refreshButtons(); }
function toggle(id){
  if(curId===id && playing){ stopAll(); setState(false); return; }
  if(curId===id && !playing && byId(id).audio && audio.currentTime>0 && !audio.ended){ audio.play(); setState(true); return; }
  stopAll(); curId = id; const j = byId(id);
  $("mini").hidden = false; $("miniTitle").textContent = j.t; $("miniBar").style.width="0"; $("miniTime").textContent="0:00";
  if(j.audio){
    audio.src = j.audio; audio.currentTime = 0;
    audio.play().then(()=>setState(true)).catch(()=>setState(false));
  } else speak(j);
}
function speak(j){
  if(!synth){ setState(false); return; }
  const my = ++token; setState(true);
  const lines = j.text.split("\n").map(l=>l.replace(/^—/,""));
  const total = lines.length; let n = 0;
  const next = () => {
    if(my!==token) return;
    $("miniBar").style.width = (n/total*100)+"%";
    if(n>=total){ setState(false); return; }
    const u = new SpeechSynthesisUtterance(lines[n++]);
    u.lang="es-ES"; if(voice) u.voice=voice; u.rate=.95;
    u.onend=()=>setTimeout(next,650);
    u.onerror=()=>{ if(my===token) setState(false); };
    synth.speak(u);
  };
  next();
}
audio.addEventListener("timeupdate",()=>{
  if(!audio.duration) return;
  $("miniBar").style.width = (audio.currentTime/audio.duration*100)+"%";
  $("miniTime").textContent = fmt(audio.currentTime);
});
audio.addEventListener("ended",()=>setState(false));
$("miniPlay").onclick = () => curId && toggle(curId);

function refreshButtons(){
  document.querySelectorAll("[data-play]").forEach(b=>{
    const on = playing && b.dataset.play===curId;
    b.classList.toggle("on", on);
    b.innerHTML = on ? ICON_PAUSE : ICON_PLAY;
    b.setAttribute("aria-label", (on?"Pausar ":"Escuchar ") + byId(b.dataset.play).t);
  });
  $("miniPlay").innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  $("miniPlay").classList.toggle("on", playing);
  $("miniPlay").setAttribute("aria-label", playing ? "Pausar" : "Escuchar");
}

/* ---------- views ---------- */
function meta(j){ return esc(j.cat) + (j.audio ? "" : " · voz provisional"); }
function row(j){
  return `<li>
    <button class="play" type="button" data-play="${j.id}"></button>
    <div class="info"><div class="t">${esc(j.t)}</div><div class="m">${meta(j)}</div></div>
    <a class="share" href="${wa(j)}" target="_blank" rel="noopener" aria-label="Compartir ${esc(j.t)} por WhatsApp">${ICON_SHARE}</a>
    <button class="save" type="button" data-save="${j.id}" aria-pressed="${saved.has(j.id)}" aria-label="Guardar ${esc(j.t)}">${ICON_SAVE}</button>
  </li>`;
}
function list(items, emptyMsg){ return items.length ? `<ul class="list">${items.map(row).join("")}</ul>` : `<p class="empty">${emptyMsg}</p>`; }

function render(){
  const v = $("view");
  if(tab==="home"){
    const d = dayPick();
    const best = J.filter(j=>j.top);
    const latest = [...J].reverse().slice(0,10);
    if(!d){ v.innerHTML = `<section class="hero"><span class="eyebrow">Chiste del día</span><p class="t">Muy pronto</p><span class="m">Los primeros chistes están en camino.</span></section>`; }
    else v.innerHTML = `
      <section class="hero">
        <span class="eyebrow">Chiste del día</span>
        <p class="t">${esc(d.t)}</p>
        <button class="bigplay" type="button" data-play="${d.id}"></button>
        <span class="m">${meta(d)}</span>
        <div class="actions">
          <a class="wa" href="${wa(d)}" target="_blank" rel="noopener">${ICON_SHARE} Compartir</a>
          <button class="hsave" type="button" data-save="${d.id}" data-hero="1" aria-pressed="${saved.has(d.id)}">${ICON_SAVE} ${saved.has(d.id)?"Guardado":"Guardar"}</button>
        </div>
      </section>
      <h2 class="sec">Los mejores</h2>
      ${list(best,"Todavía no hay destacados.")}
      <h2 class="sec">Últimos añadidos</h2>
      ${list(latest,"Todavía no hay chistes.")}`;
  }
  if(tab==="cats"){
    if(openCat){
      v.innerHTML = `<button class="back" type="button" id="back">‹ Categorías</button>
        <h1 class="view">${esc(openCat)}</h1>
        ${list(J.filter(j=>j.cat===openCat),"Aún no hay chistes en esta categoría.")}`;
      $("back").onclick=()=>{openCat=null;render();};
    } else {
      v.innerHTML = `<h1 class="view">Categorías</h1><div class="cats">${CATS.map(c=>{
        const n=J.filter(j=>j.cat===c.n).length;
        return `<button class="cat" type="button" data-cat="${esc(c.n)}"><span class="e">${c.e}</span><span class="n">${esc(c.n)}</span><span class="c">${n} ${n===1?"chiste":"chistes"}</span></button>`;
      }).join("")}</div>`;
      v.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{openCat=b.dataset.cat;render();});
    }
  }
  if(tab==="search"){
    v.innerHTML = `<h1 class="view">Buscar</h1>
      <input class="search" id="q" type="search" placeholder="Busca por título o categoría" autocomplete="off" value="${esc(query)}">
      <div id="results" style="margin-top:14px"></div>`;
    const q=$("q");
    const run=()=>{ query=q.value; const s=query.trim().toLowerCase();
      const r = s ? J.filter(j=>(j.t+" "+j.cat+" "+j.text).toLowerCase().includes(s)) : J;
      $("results").innerHTML = list(r, s ? "No hay ningún chiste con esa palabra." : "Todavía no hay chistes.");
      bindRows($("results")); };
    q.oninput=run; run();
  }
  if(tab==="saved"){
    v.innerHTML = `<h1 class="view">Guardados</h1>${list(J.filter(j=>saved.has(j.id)),"Toca el marcador de un chiste para guardarlo aquí.")}`;
  }
  bindRows(v);
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current", t.dataset.tab===tab?"page":"false"));
  $("total").textContent = J.length + (J.length===1?" chiste":" chistes");
}
function bindRows(root){
  root.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>toggle(b.dataset.play));
  root.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.save; saved.has(id)?saved.delete(id):saved.add(id);
    store.set("chistaco.saved",[...saved]);
    if(tab==="saved" || tab==="home") render(); else b.setAttribute("aria-pressed", saved.has(id));
  });
  refreshButtons();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ tab=t.dataset.tab; if(tab!=="cats") openCat=null; render(); window.scrollTo(0,0); });
render();

/* ---------- install as an app ---------- */
(function(){
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if(standalone || store.get("chistaco.installHidden",false)) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const box = $("install");
  let prompt = null;
  function show(){
    const msg = ios
      ? 'Toca <b>Compartir</b> <span aria-hidden="true">⬆︎</span> abajo en Safari y luego <b>“Añadir a pantalla de inicio”</b>.'
      : prompt ? 'Tenla en tu pantalla de inicio, como una app más.'
               : 'Abre el menú <b>⋮</b> del navegador y toca <b>“Instalar aplicación”</b> o “Añadir a pantalla de inicio”.';
    box.innerHTML = `<div class="install">
      <img src="icon-192.png" alt="">
      <div><div class="t">Instala Chistaco</div><div class="m">${msg}</div></div>
      <button class="x" type="button" aria-label="Cerrar">×</button>
      ${prompt ? '<button class="go" type="button">Instalar app</button>' : ''}
    </div>`;
    box.querySelector(".x").onclick = () => { store.set("chistaco.installHidden",true); box.innerHTML=""; };
    const go = box.querySelector(".go");
    if(go) go.onclick = async () => { prompt.prompt(); await prompt.userChoice; prompt=null; box.innerHTML=""; };
  }
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); prompt = e; show(); });
  addEventListener("appinstalled", () => { box.innerHTML=""; });
  show();
})();
if("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
